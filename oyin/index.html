<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}body.odroot .phead > .bk:first-child svg{display:none}body.odroot .phead > .bk:first-child::before{content:"✕";font-size:19px;font-weight:800;line-height:1}
</style></head><body>
<title>Odobim — bolalar uchun odob o'yini</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700&family=Amiri:wght@700&display=swap">
<style>
/* Layout: bitta telefon ustuni; kechki Madina osmoni (lapis) + Samarqand firuzasi + oltin yulduz */
:root{
  --bg:#0B1520; --surface:#12202E; --surface2:#182A3B; --line:#24394D; --fg:#E9F1F6; --muted:#8EA3B4;
  --accent:#2BB5A3; --on-accent:#05302B; --gold:#E8B04B; --on-gold:#3A2604; --fire:#F08A3C; --red:#E5566A; --ok:#3CC583;
  --o0:#2BB5A3; --o1:#4C86DC; --o2:#D9822B; --o3:#9A6BDB;
  --font-d:"Unbounded","Onest",system-ui,sans-serif; --font-b:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --font-ar:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  --r:18px; --shadow:0 10px 30px rgba(0,0,0,.25); color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F1F5F8; --surface:#FFFFFF; --surface2:#E8EFF4; --line:#D5E0E8; --fg:#0F1F2C; --muted:#5A6E7F;
  --accent:#12907F; --on-accent:#FFFFFF; --gold:#C48810; --on-gold:#FFFFFF; --fire:#DB6A1E; --red:#D23A50; --ok:#1D9A5C;
  --o0:#12907F; --o1:#3B72C8; --o2:#C8711C; --o3:#8152C4; --shadow:0 8px 24px rgba(15,31,44,.10); color-scheme:light }}
:root[data-theme="light"]{
  --bg:#F1F5F8; --surface:#FFFFFF; --surface2:#E8EFF4; --line:#D5E0E8; --fg:#0F1F2C; --muted:#5A6E7F;
  --accent:#12907F; --on-accent:#FFFFFF; --gold:#C48810; --on-gold:#FFFFFF; --fire:#DB6A1E; --red:#D23A50; --ok:#1D9A5C;
  --o0:#12907F; --o1:#3B72C8; --o2:#C8711C; --o3:#8152C4; --shadow:0 8px 24px rgba(15,31,44,.10); color-scheme:light }
:root[data-theme="dark"]{ color-scheme:dark }

html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--font-b);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.has-nav{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:13px} .gold{color:var(--gold)} .teal{color:var(--accent)} .fire{color:var(--fire)} .red{color:var(--red)}
.sp{flex:1}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row>div{min-width:0;display:flex;flex-direction:column;gap:2px}
[hidden]{display:none!important}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.eb{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}

/* tugmalar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--fg);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn.gold{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 82%,#fff),var(--gold));color:var(--on-gold);box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 30%,transparent)}
.btn.teal{background:var(--accent);color:var(--on-accent)}
.btn.red{background:var(--red);color:#fff}
.btn.dark{background:color-mix(in srgb,var(--accent) 16%,var(--surface2));color:var(--fg);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.icb{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none}
.icb.on{color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--fg);border:1px solid var(--line)}
.chip.on{background:color-mix(in srgb,var(--gold) 22%,var(--surface2));border-color:color-mix(in srgb,var(--gold) 50%,transparent);color:var(--gold)}
.chip.teal{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.lnk{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;font-weight:600}
.pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pill{padding:7px 14px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:600;font-size:13.5px;border:1px solid var(--line)}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* kartalar */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.link{flex-direction:row;align-items:center;gap:12px;text-align:left;width:100%}
.card.link b{display:block}
.card.link small{color:var(--muted);font-size:12.5px}
.card.link>div{flex:1;min-width:0}
.chev{color:var(--muted)}
.ib{width:40px;height:40px;padding:9px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,var(--surface2));color:var(--accent);flex:none;display:grid;place-items:center}
span.ib .ico{width:22px;height:22px}
svg.ib{width:40px;height:40px}
.card h3{font-size:15px;display:flex;align-items:center;gap:8px;font-family:var(--font-b);font-weight:700}
.card h3 .ico{color:var(--accent)}
.card p{line-height:1.55}
.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand b{font:700 17px var(--font-d);letter-spacing:-.01em;white-space:nowrap}
.logo{width:32px;height:32px;flex:none}
.ctrs{display:flex;gap:6px}
.ctr{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface2);border:1px solid var(--line)}
.ctr.fire{color:var(--fire)} .ctr.star{color:var(--gold)} .ctr.moon{color:var(--accent)}
.ctr span{color:var(--fg)}
.pbar{display:flex;align-items:center;gap:8px;width:100%;max-width:520px;margin:0 auto;padding:9px 16px;font-size:14px}
.pnow{display:flex;align-items:center;gap:6px;min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.pnow>.ico{color:var(--accent)} .pnow b{color:var(--accent)}
.locchip{display:inline-flex;align-items:center;gap:4px;max-width:46%;padding:5px 8px 5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;font-weight:700;flex:none}
.locchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locchip .ico{color:var(--accent);width:1em;height:1em}
.travel{display:flex;align-items:center;gap:10px;max-width:488px;margin:0 16px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line))}
@media (min-width:520px){ .travel{margin:0 auto} }
.travel>span{color:var(--gold)} .travel p{flex:1;font-size:13.5px;font-weight:600}
.locrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);text-align:left}
.locrow>.ico{color:var(--accent)} .locrow span{flex:1;min-width:0;display:flex;flex-direction:column} .locrow small{color:var(--muted);font-size:12px}
.locrow em{font-style:normal;font-size:13px;font-weight:700;color:var(--accent)}
.pset{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:14px;font-weight:600}
.pset select{max-width:60%;background:transparent;border:0;color:var(--fg);font:600 14px var(--font-b);text-align:right}
.pset select option{background:var(--surface);color:var(--fg)}
.notif{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--gold) 8%,var(--surface2));border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line))}
.notif .pills{justify-content:flex-start}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.tgl span{display:flex;gap:8px;align-items:center} .tgl .ico{color:var(--gold)}
.tgl input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:28px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.tgl input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl input:checked{background:var(--accent)} .tgl input:checked::after{transform:translateX(18px)}
.travel.ask{margin-top:4px}
.clist{display:flex;flex-direction:column;gap:8px}
.clist .eb{margin-top:6px}
.city{margin-left:auto;display:flex;background:var(--surface2);border-radius:999px;padding:3px;border:1px solid var(--line);flex:none}
.city i{font-style:normal;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--muted);cursor:pointer}
.city i.on{background:var(--accent);color:var(--on-accent)}

/* asosiy */
.streak{background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--fire) 16%,transparent),transparent 60%),var(--surface)}
.streak .ib{background:color-mix(in srgb,var(--fire) 18%,var(--surface2));color:var(--fire)}
.flames{display:flex;gap:3px;color:color-mix(in srgb,var(--muted) 40%,transparent)}
.flames .lit{color:var(--fire)}
.flames .ico{fill:currentColor;stroke:none}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tiles.t3{grid-template-columns:repeat(3,1fr);gap:10px}
.tiles.t3 .tile{font-size:13px;padding:12px 6px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.tiles.t3 .tile span{max-width:56px}
.ptoday{cursor:pointer}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pg{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;background:var(--surface2);font-size:12px;color:var(--muted)}
.pg b{font-size:16px;color:var(--fg)}
.pg.on{background:color-mix(in srgb,var(--accent) 22%,var(--surface2));outline:1.5px solid var(--accent)}
.pg.on span,.pg.on b{color:var(--accent)}
.odbx{padding:16px;cursor:pointer}
.odbx .odb-art .odlogo{width:104px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-align:center;color:var(--fg)}
.tile span{width:100%;aspect-ratio:1;max-width:60px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 24%,var(--surface2)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));color:var(--accent)}
.tile span .ico{width:24px;height:24px}
.tile:active span{transform:scale(.95)}
@media (max-width:380px){ .tiles{grid-template-columns:repeat(3,1fr)} }
.odb{flex-direction:row;align-items:center;gap:12px;background:linear-gradient(120deg,color-mix(in srgb,var(--o2) 18%,var(--surface)),var(--surface))}
.odb-art svg{width:58px;height:72px} .odb-art .odlogo{width:84px;animation:float 3s ease-in-out infinite}
.odwl{width:min(70vw,260px);margin:0 auto;animation:pop .5s} .odwl.sm{width:150px}
img.eic{height:1.15em;width:auto;vertical-align:-.2em;display:inline-block;margin:0 .05em;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.rhearts i img.eic{height:22px;vertical-align:middle}
.rhearts i:not(.on) img.eic{filter:grayscale(1) opacity(.35)}
.hubver{text-align:center;font-size:11px;font-weight:800;opacity:.45;margin:2px 0 4px}
.hublogo{width:170px;margin:-6px auto -10px;animation:float 3.4s ease-in-out infinite}
.odb>div:last-child{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.odb small{color:var(--muted);font-size:13px}
.rail{padding:14px 0 14px 14px}
.rail .row{padding-right:14px}
.cap{font:700 14px var(--font-d);letter-spacing:.02em;text-transform:uppercase}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-right:14px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pc{flex:0 0 168px;scroll-snap-align:start;display:flex;flex-direction:column;gap:5px;background:var(--surface2);border-radius:14px;overflow:hidden;padding-bottom:10px;border:1px solid var(--line)}
.pc b{font-size:13.5px;padding:0 10px;line-height:1.3}
.pc small{font-size:12px;color:var(--muted);padding:0 10px;display:flex;gap:4px;align-items:center}
.pc-img{position:relative;height:96px;display:grid;place-items:center;color:#fff;background:var(--c,#2a5b6e)}
.pc-img>.ico{width:40px;height:40px;opacity:.9}
.pc-img em{position:absolute;left:8px;top:8px;font-style:normal;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.4);color:#fff}
.c-masjid{--c:linear-gradient(140deg,#1F7A6E,#0F3F4E)} .c-tarixiy{--c:linear-gradient(140deg,#9A6A2E,#4E3216)} .c-qabriston{--c:linear-gradient(140deg,#4F6170,#25313C)} .c-muzey{--c:linear-gradient(140deg,#6B4FA6,#33285A)} .c-uni{--c:linear-gradient(140deg,#2E5FA8,#162E55)}
.pc-img,.hero,.pl .pc-img{background:var(--c)}

/* sahifa sarlavhasi */
.phead{display:flex;align-items:center;gap:12px}
.phead h1{font:700 19px var(--font-d)}
.phead p{color:var(--muted);font-size:13px}
.bk{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);flex:none;border:1px solid var(--line)}

/* pastki menyu */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:4px;padding:6px;border-radius:22px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;width:68px;padding:7px 0 5px;border-radius:16px;color:var(--muted);font-size:10.5px;font-weight:600;position:relative}
#nav button .ico{width:23px;height:23px}
#nav button.on{color:var(--fg);background:var(--surface2)}
#nav button.on::after{content:"";position:absolute;bottom:-3px;width:18px;height:3px;border-radius:3px;background:var(--gold)}

/* sheet / toast */
.modal{position:fixed;inset:0;z-index:20;background:rgba(3,8,14,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out;border-top:1px solid var(--line)}
.grab{display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 4px}
.sheet h2{font:700 19px var(--font-d)}
.big{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,var(--surface2));color:var(--accent)}
.big .ico{width:34px;height:34px}
.big.fire{color:var(--fire);background:color-mix(in srgb,var(--fire) 16%,var(--surface2))}
.big.fire .ico{fill:currentColor;stroke:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow);animation:up .2s}
@keyframes up{from{transform:translate(var(--tx,0),16px);opacity:0}} .toast{--tx:-50%}
@keyframes fade{from{opacity:0}}
.nextp{display:flex;justify-content:space-between;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,var(--surface2));font-size:14px}
.nextp b{color:var(--accent)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface2);font-weight:600}
.prow.on{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 30%,var(--surface2)),var(--surface2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.exrow{display:flex;gap:10px;width:100%}
.exrow div{flex:1;padding:12px;border-radius:14px;background:var(--surface2);display:flex;flex-direction:column;align-items:center}
.exrow b{font:700 24px var(--font-d)}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--surface2);font-size:22px;font-weight:700}

/* quiz ro'yxati */
.banners{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.banners::-webkit-scrollbar{display:none}
.banner{flex:0 0 100%;scroll-snap-align:center;position:relative;border-radius:22px;padding:16px;background:radial-gradient(100% 120% at 100% 0%,color-mix(in srgb,var(--gold) 20%,transparent),transparent 55%),linear-gradient(150deg,color-mix(in srgb,var(--accent) 28%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.banner h2{font:700 21px var(--font-d);margin:2px 0 4px}
.banner p{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.trophy{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--gold) 18%,var(--surface2));color:var(--gold);display:grid;place-items:center}
.bdots{display:flex;gap:5px;justify-content:center}
.bdots i{width:6px;height:6px;border-radius:6px;background:var(--line);transition:width .2s}
.bdots i.on{width:22px;background:var(--accent)}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.tabs3.t2{grid-template-columns:1fr 1fr}
.tabs3 button{padding:9px 4px;border-radius:10px;text-align:center;font-weight:600;font-size:13.5px;color:var(--muted)}
.tabs3 button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 0 var(--line)}
.books{display:flex;flex-direction:column;gap:10px}
.book{display:flex;gap:12px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.cover{width:62px;height:84px;flex:none;border-radius:6px 10px 10px 6px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c));display:flex;align-items:flex-end;padding:6px;box-shadow:inset 4px 0 0 rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.2)}
.cover span{font-size:9.5px;font-weight:700;color:#fff;line-height:1.15}
.bi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bi>b{font-size:15px}
.bi small{font-size:12.5px;color:var(--muted)}
.bi .row{margin-top:6px;gap:8px}

/* quiz yechish */
.qz,.lesson{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:14px;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.qtop,.qtime{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s}
.bar.thin{height:6px} .bar.thin i{background:var(--gold);transition:width 1s linear}
.bar.warn i{background:var(--red)}
.qhead{display:flex;justify-content:space-between;align-items:center}
.lives{display:flex;gap:4px;color:var(--line)} .lives .on{color:var(--red)} .lives .ico{fill:currentColor;stroke:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--accent)}
.tag.gold{color:var(--gold)}
.qq{font:700 20px/1.35 var(--font-b);padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.qopts{display:flex;flex-direction:column;gap:10px}
.qo{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;transition:background .15s,border-color .15s}
.qo kbd{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);font:700 12px var(--font-b);color:var(--muted)}
.qo.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));border-color:var(--ok)} .qo.ok kbd{background:var(--ok);color:#fff}
.qo.bad{background:color-mix(in srgb,var(--red) 16%,var(--surface));border-color:var(--red)} .qo.bad kbd{background:var(--red);color:#fff}
.fb{padding:14px;border-radius:14px;display:flex;flex-direction:column;gap:8px;animation:up .2s}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface))} .fb.ok b{color:var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--red) 12%,var(--surface))} .fb.bad b{color:var(--red)}
.fb p{font-size:14px}
.res{max-width:520px;margin:0 auto;padding:40px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.res .mascot{width:110px;height:138px}
.res h1{font:700 22px var(--font-d);color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stats div{border-radius:14px;border:1.5px solid var(--c);overflow:hidden;background:var(--surface)}
.stats span{display:block;background:var(--c);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 4px}
.stats b{display:flex;align-items:center;justify-content:center;gap:4px;font:700 20px var(--font-d);padding:9px 4px;color:var(--c)}
.stats .ico{fill:currentColor;stroke:none}
.bonus{padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 18%,var(--surface));color:var(--gold);font-weight:700}

/* reyting */
.prize .podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.podium div{display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 4px;border-radius:12px;background:var(--surface2);font-weight:700}
.podium .p1{color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--surface2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent)}
.podium .p2{color:#B9C4CE} .podium .p3{color:#C98B5A}
.rows{display:flex;flex-direction:column;gap:6px}
.rk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.rk.me{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.rk .n{width:22px;text-align:center;font-weight:700;color:var(--muted)} .rk .n.top{color:var(--gold)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 22%,var(--surface2));color:var(--accent);font:700 15px var(--font-d);flex:none;text-transform:uppercase}
.rk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mybar{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom,0px));padding:12px;border-radius:14px;text-align:center;background:color-mix(in srgb,var(--accent) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);font-weight:600}

/* tasbeh */
.tas .zk{text-align:center;display:flex;flex-direction:column;gap:2px;min-height:96px;justify-content:center}
.ar{font:700 30px/1.5 var(--font-ar);color:var(--gold)}
.zk h2{font:700 19px var(--font-d)}
.zk small{color:var(--muted)}
.ring{position:relative;width:min(78vw,290px);aspect-ratio:1;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,var(--surface)) 0,var(--surface) 70%);box-shadow:0 0 60px color-mix(in srgb,var(--gold) 18%,transparent);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ring:active{transform:scale(.985)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:var(--surface2);stroke-width:12}
.ring .rp{fill:none;stroke:var(--gold);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .2s}
.ring span{display:flex;flex-direction:column;align-items:center;position:relative}
.ring b{font:700 60px var(--font-d);line-height:1}
.ring small{color:var(--muted);font-weight:600}
.tstats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tstats span{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.tstats .ico.fire{fill:currentColor;stroke:none}

/* qibla */
.compass{width:min(78vw,280px);aspect-ratio:1;margin:8px auto}
.dial{position:relative;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,var(--surface) 55%,var(--surface2));border:2px solid var(--line);transition:transform .25s}
.dial i{position:absolute;font-style:normal;font-weight:700;font-size:13px;color:var(--muted)}
.dial .n{top:8px;left:50%;transform:translateX(-50%);color:var(--red)} .dial .s{bottom:8px;left:50%;transform:translateX(-50%)} .dial .e{right:10px;top:50%;transform:translateY(-50%)} .dial .w{left:10px;top:50%;transform:translateY(-50%)}
.needle{position:absolute;inset:0;display:flex;justify-content:center}
.needle::before{content:"";position:absolute;top:22%;bottom:50%;width:4px;border-radius:4px;background:var(--gold)}
.needle span{margin-top:8%;width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;position:relative}
.qb h2{font:700 32px var(--font-d)}

/* valyuta */
.fx{display:flex;flex-direction:column;gap:6px;position:relative}
.fxr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.fxr select{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:600 15px var(--font-b)}
.fxr select option{background:var(--surface);color:var(--fg)}
.fxr input{width:45%;text-align:right;background:transparent;border:0;color:var(--fg);font:700 22px var(--font-d)}
.fxr b{font:700 22px var(--font-d)}
.swap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:3px solid var(--bg)}
.fxline{text-align:center}
.rates{display:flex;flex-direction:column;gap:6px}
.rate{display:flex;justify-content:space-between;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.rate span{color:var(--muted)}

/* joylar */
.plist2{display:flex;flex-direction:column;gap:8px}
.prow2{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left}
.prow2>div{flex:1;min-width:0} .prow2 b{display:block} .prow2 small{color:var(--muted)}
.maps{display:flex;gap:8px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-bottom:1px solid var(--line)}
.cats button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.cats button.on{color:var(--accent);border-color:var(--accent)}
.cats .ico{width:22px;height:22px}
.plist3{display:flex;flex-direction:column;gap:10px}
.pl{display:flex;gap:12px;padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left}
.pl .pc-img{width:104px;height:auto;min-height:96px;border-radius:12px;flex:none}
.pl>div:last-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pl small{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:4px}
.pl p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero{position:relative;margin:-12px -16px 0;padding:56px 16px 18px;color:#fff;display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:200px;justify-content:flex-end}
.hero .bk{position:absolute;left:16px;top:12px;background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.15);color:#fff}
.heroi{position:absolute;right:-10px;top:10px;width:150px!important;height:150px!important;opacity:.16;stroke-width:1.4}
.hero h1{font:700 24px var(--font-d)}
.hero p{display:flex;justify-content:space-between;gap:10px;opacity:.9;flex-wrap:wrap}
.hero .ar{font-size:20px;color:#fff}
.hero .chip{align-self:flex-start;background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.18);color:#fff}
.note2{flex-direction:row;gap:10px;background:color-mix(in srgb,var(--gold) 10%,var(--surface));border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.note2 .ico{color:var(--gold);margin-top:2px}
.card p .ico{color:var(--muted)}
.srclink{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface2);color:var(--accent);font-size:13px;font-weight:600;word-break:break-all;text-align:left}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.facts .ico{color:var(--accent)}
.dots2{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.dots2 li::marker{color:var(--accent)}
.card .card.link{background:var(--surface2)}

/* rawdah */
.subtabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.subtabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;color:var(--muted);border-bottom:2px solid transparent;font-size:11px;font-weight:600}
.subtabs .ico{width:22px;height:22px}
.subtabs button.on{color:var(--accent);border-color:var(--accent)}
.card.tip{flex-direction:row;gap:12px}
.card.tip p{color:var(--muted);font-size:13.5px;margin-top:3px}
.card.warn{background:color-mix(in srgb,var(--gold) 12%,var(--surface));border-color:color-mix(in srgb,var(--gold) 40%,var(--line));align-items:center;text-align:center}
.card.warn .ib{background:color-mix(in srgb,var(--gold) 20%,var(--surface2));color:var(--gold)}
.card.mini{flex:0 0 250px;scroll-snap-align:start}
.card.mini p{font-size:13px;color:var(--muted)}
.hscroll.rules{margin:0 -16px;padding:0 16px}
.st{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.st.pending{color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,var(--surface2))}
.st.ready{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface2))}
.st.rejected{color:var(--red);background:color-mix(in srgb,var(--red) 15%,var(--surface2))}
.feedi{margin:0 0 10px auto;max-width:86%;padding:10px 12px;border-radius:16px 16px 4px 16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.feedi small.teal{font-weight:700}

/* formalar */
.lbl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font:600 15px var(--font-b)}
.seg{display:grid;gap:8px}
.seg.s2{grid-template-columns:1fr 1fr} .seg.s3{grid-template-columns:repeat(3,1fr)} .seg.s4{grid-template-columns:repeat(4,1fr)}
.opt{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 6px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:14px;text-align:center}
.opt.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.toggles{display:flex;flex-direction:column;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.toggles label{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;background:var(--surface2);font-weight:600}
.toggles label+label{border-top:1px solid var(--line)}
.toggles span{display:flex;gap:8px;align-items:center}
.toggles input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:28px;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.toggles input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggles input:checked{background:var(--accent)} .toggles input:checked::after{transform:translateX(18px)}
.langs{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600}
.lrow.on{border-color:var(--accent);color:var(--accent)}

/* profil */
.prof{display:flex;flex-direction:column;align-items:center;gap:4px;padding:24px 16px;border-radius:22px;background:radial-gradient(110% 100% at 50% 0%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%),var(--surface);border:1px solid var(--line)}
.ava{width:88px;height:88px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--surface2);border:3px solid var(--gold);margin-bottom:6px}
.ava img{width:100%;height:100%;object-fit:cover}
.ava span{font:700 34px var(--font-d);color:var(--gold);text-transform:uppercase}
.prof h1{font:700 21px var(--font-d)}
.prof small{color:var(--muted)}
.kv{gap:0;padding:0 14px}
.kv div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;font-size:14px}
.kv div+div{border-top:1px solid var(--line)}
.kv span{color:var(--muted)}
.inv .gift{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 80%,#fff),var(--gold));color:var(--on-gold)}
.inv .gift .ico{width:32px;height:32px}
.inv h2{font:700 20px var(--font-d)}
.reflink{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.reflink span{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two div{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center}
.two b{font:700 24px var(--font-d)} .two small{color:var(--muted);font-size:12px}
.guide p+p{margin-top:2px}
.quote{padding:10px 12px;border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--surface2));border-radius:0 10px 10px 0;font-size:13.5px}

/* onboarding / ro'yxat */
.onb{max-width:520px;margin:0 auto;min-height:100vh;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:radial-gradient(90% 60% at 50% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%)}
.onb-card{position:relative;width:100%;min-height:400px;padding:28px 20px 80px;border-radius:26px;background:var(--surface);border:1px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:var(--shadow)}
.onb-ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,var(--surface2));color:var(--accent);box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 8%,transparent)}
.onb-ic .ico{width:34px;height:34px}
.onb-card h2{font:700 22px var(--font-d);margin-top:4px}
.onb-card p{color:var(--muted);max-width:38ch}
.onb-card .btn.wide{position:absolute;left:20px;right:20px;bottom:20px;width:auto}
.fab{position:absolute;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 80%,#fff),var(--gold));color:var(--on-gold);display:grid;place-items:center;box-shadow:0 8px 22px color-mix(in srgb,var(--gold) 35%,transparent)}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:7px;background:var(--line);transition:width .2s}
.dots i.on{width:24px;background:var(--gold)}
.reg{max-width:520px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.reg-top{display:grid;place-items:center;padding:22px 0 10px;border-radius:22px;background:radial-gradient(80% 100% at 50% 0%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%)}
.reg-top .logo{width:64px;height:64px}
.reg .btn.wide{margin-top:12px}


/* sovg'alar */
.gbal{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;border-radius:20px;background:radial-gradient(100% 120% at 100% 0%,color-mix(in srgb,var(--gold) 26%,transparent),transparent 60%),var(--surface);border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line))}
.gbal small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.gbal b{display:flex;align-items:center;gap:6px;font:700 30px var(--font-d);color:var(--gold)}
.gbal b .ico{width:26px;height:26px}
.gbar{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 70%,#fff))}
.gbar.thin{height:5px;margin-top:4px}
.gteaser .ib.gold{background:color-mix(in srgb,var(--gold) 18%,var(--surface2));color:var(--gold)}
.gcovers{display:flex;align-items:flex-end;gap:8px}
.gcovers .btn{margin-left:auto}
.cover.sm{width:42px;height:58px;padding:4px}
.cover.sm span{font-size:6.5px}
.glist{display:flex;flex-direction:column;gap:10px}
.gift{display:flex;gap:12px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.gift.locked{opacity:.72}
.gi{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.gi>b{font-size:15px}
.price{display:inline-flex;align-items:center;gap:4px;font:700 16px var(--font-d);color:var(--gold)}
.gico{width:62px;height:62px;flex:none;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--o2),color-mix(in srgb,var(--o2) 60%,#000))}
.gico.book{background:linear-gradient(140deg,var(--o1),color-mix(in srgb,var(--o1) 60%,#000))}
.gico .ico{width:30px;height:30px}
.req{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.odprog .mascot{width:52px;height:66px;flex:none}
.steps{display:flex;gap:5px;margin-top:6px}

.lw{flex:1;display:flex;flex-direction:column;gap:14px}
.qrow{display:flex;gap:10px;align-items:flex-end}
.qrow .mascot{width:52px;height:66px;flex:none}

.opts{display:grid;gap:10px} .opts.tf{grid-template-columns:1fr 1fr}

.opt2.sel{border-color:var(--o1);background:color-mix(in srgb,var(--o1) 14%,var(--surface));box-shadow:0 4px 0 var(--o1);color:var(--o1)}
.opts.tf .opt2{flex-direction:column;justify-content:center;padding:20px 10px;text-align:center;font:700 17px var(--font-b)}
.bigs{font-size:30px}

.mascot{display:block}

/* ===================== ODOBIM O'YINLARI ===================== */
[data-g="m"]{--ga:#2F7FE0;--gb:#14A38F;--gs:#E8F2FF;--gk:#163A66;--gpat:radial-gradient(circle at 20% 20%,rgba(47,127,224,.10) 0 8px,transparent 9px),radial-gradient(circle at 70% 60%,rgba(20,163,143,.10) 0 6px,transparent 7px)}
[data-g="f"]{--ga:#E0569B;--gb:#9B5DE5;--gs:#FFEFF6;--gk:#6A1F48;--gpat:radial-gradient(circle at 20% 20%,rgba(224,86,155,.12) 0 8px,transparent 9px),radial-gradient(circle at 70% 60%,rgba(155,93,229,.10) 0 6px,transparent 7px)}
[data-g=""]{--ga:var(--accent);--gb:var(--o1);--gs:var(--surface2);--gk:var(--fg)}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;font:800 16px var(--font-b);background:#fff;color:var(--gk);box-shadow:0 4px 0 rgba(0,0,0,.18);border:2px solid rgba(0,0,0,.06);transition:transform .08s}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.gbtn.go{background:linear-gradient(180deg,color-mix(in srgb,var(--ga) 80%,#fff),var(--ga));color:#fff;border-color:transparent;box-shadow:0 5px 0 color-mix(in srgb,var(--ga) 60%,#000)}
.gbtn.big{width:100%;font-size:17px;padding:15px}
.gbtn.mega{width:100%;font:800 22px var(--font-d);padding:18px;letter-spacing:.04em;border-radius:22px}
.gbtn.mega .ico{width:26px;height:26px}
.gbtn:disabled{opacity:.55;filter:grayscale(.4)}
svg.hero,img.heroimg{display:block;width:100%;height:100%;overflow:visible;margin:0;padding:0;min-height:0;position:static;color:inherit}
img.heroimg{object-fit:contain;object-position:50% 100%;-webkit-user-drag:none;user-select:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18));animation:breathe 3s ease-in-out infinite;transform-origin:50% 100%}
.odlogo{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))} .odmascot{display:block;width:100%;height:auto}
.winhero svg.hero,.winhero img.heroimg{position:relative}
svg.hero.mini{width:56px;height:70px;flex:none}
.hero.idle{animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
.hero.jump{animation:hop .6s ease-out 2}
.hero .spark{animation:twinkle 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,.985)}}
@keyframes twinkle{50%{opacity:.3}}
/* hub */

.chcard[data-g="m"]{background:linear-gradient(170deg,#E3F0FF,#CBE3FF);color:#163A66}

/* hud */
.ghud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.ghud>b{flex:1;min-width:0;font:700 16px var(--font-d);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.9);color:var(--gk);box-shadow:0 3px 0 rgba(0,0,0,.15);flex:none}

.gstar,.cst{display:inline-flex;align-items:center;gap:4px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.92);color:#7A5200;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12);font-variant-numeric:tabular-nums;flex:none}

.ginv svg{width:100%;height:100%}

.gmapw .ghud{position:sticky}
.vmap{position:relative;max-width:520px;margin:0 auto;height:1000px}

.vpath path{fill:none;stroke:#F6E3B4;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.vnode{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:140px}
.vbub{width:84px;height:78px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ga);box-shadow:0 7px 0 color-mix(in srgb,var(--ga) 60%,#000)}

.vnode.lock .vbub{background:#C9D3D9;color:#7A8A94;box-shadow:0 7px 0 #93A2AB}
.vnode.cur .vbub{animation:pulse 1.6s ease-in-out infinite}
.vhero{position:absolute;left:-36px;top:-30px;width:56px;height:82px}
/* dunyo — 3D */
.gm{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:linear-gradient(180deg,#3FA9F5 0%,#7FCBFA calc(var(--hor) * .6),#CFEFFF var(--hor),#CFEFFF 100%)}

.gm[data-g="f"]{background:linear-gradient(180deg,#B57CF0 0%,#F59BCB calc(var(--hor) * .6),#FFE0EC var(--hor),#FFE0EC 100%)}
.gview{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.gm.talk .gview{transform:scale(1.07)}
.gsky{position:absolute;inset:0;pointer-events:none}
.gsky .sun{position:absolute;right:10%;top:calc(var(--hor) * .18);width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#FFFBE0,#FFE15A 55%,#FFC21E);box-shadow:0 0 40px 10px rgba(255,225,90,.65)}
.gsky .sun b{position:absolute;inset:-70px;border-radius:50%;background:repeating-conic-gradient(rgba(255,240,170,.38) 0 9deg,transparent 9deg 22deg);-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent);mask-image:radial-gradient(closest-side,#000 30%,transparent);animation:spin 30s linear infinite}
.gsky .rainbow{position:absolute;left:-18%;top:calc(var(--hor) - 40vw + 10px);width:80vw;aspect-ratio:1;opacity:.85;border-radius:50%;background:radial-gradient(closest-side,transparent 62%,rgba(255,80,80,.38) 63% 66%,rgba(255,170,60,.38) 66% 69%,rgba(255,235,80,.38) 69% 72%,rgba(90,210,110,.38) 72% 75%,rgba(80,160,255,.38) 75% 78%,rgba(160,100,240,.38) 78% 81%,transparent 82%)}
.gstrip{position:absolute;left:0;background-repeat:repeat-x;pointer-events:none;will-change:transform}
.gstrip.cloud{opacity:.92}
.gstrip.mtn{opacity:.85;filter:saturate(1.1)}
.gland{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#C7EBAA 0%,#9ADB7C 30%,#83CC66 100%)}
.th-garden .gland{background:linear-gradient(180deg,#D7F2C0 0%,#A5E08A 30%,#8AD272 100%)}
.g3{position:absolute;inset:0;pointer-events:none}
.g3b{pointer-events:auto}
.gplane{position:absolute;transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000 72%,transparent 98%);mask-image:linear-gradient(to top,#000 72%,transparent 98%);will-change:transform}
.gcam{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.gdec{position:absolute;pointer-events:none;backface-visibility:hidden}
.gdec svg,.gob svg{width:100%;height:100%;display:block;overflow:visible}

@keyframes sway{50%{transform:skewX(-8deg)}}
@keyframes flap{to{transform:scaleX(.25)}}
@keyframes bfly{0%,100%{translate:0 0}25%{translate:40px -30px}50%{translate:80px 6px}75%{translate:30px 20px}}

@keyframes nearb{50%{transform:scale(1.05,.97)}}

.gob .mark.q{background:linear-gradient(180deg,#C59BFF,#8B4FE0);color:#fff;box-shadow:0 3px 0 #6A35B0,0 0 14px rgba(160,100,255,.7)}
.ghero{position:absolute;left:0;z-index:3}

.ghero>svg{transform-origin:50% 100%}
.ghero.left>svg{transform:scaleX(-1)}
.ghero.walk>svg{animation:walk .32s ease-in-out infinite}
.ghero.left.walk>svg{animation:walkl .32s ease-in-out infinite}

.dust{position:absolute;width:22px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,250,235,.95),rgba(230,205,160,.5) 70%,transparent);pointer-events:none;transform:translateZ(6px);animation:dust .65s ease-out forwards}

.gfx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-20px;width:12px;height:9px;border-radius:12px 0 12px 0;background:linear-gradient(135deg,#FFD1E3,#FF8FB8);opacity:.85;animation:petal var(--d) linear var(--dl) infinite}

.gmv{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#E6F2FF);color:var(--gk);box-shadow:0 5px 0 rgba(0,0,0,.2),0 8px 18px rgba(0,0,0,.15);touch-action:none}

.gtask{position:absolute;right:12px;top:calc(64px + env(safe-area-inset-top,0px));z-index:6;width:min(260px,80vw);padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.96);color:#2A2A2A;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:pop .25s}

.gtask li{display:flex;gap:6px;align-items:flex-start} .gtask li .ico{color:#E8A317;flex:none} .gtask li.ok{color:#23905C;text-decoration:line-through}
.gtask li.ok .ico{color:#23905C} .gtask small{color:#666;display:flex;gap:4px;align-items:center}
.gmus.off{opacity:.55;position:relative}
.gmus.off::after{content:"";position:absolute;left:9px;right:9px;top:50%;height:3px;border-radius:2px;background:#E5484D;transform:rotate(-40deg)}
/* effektlar */
#fxl{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.fxp{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);background:var(--c);border-radius:50%;animation:fxb .9s cubic-bezier(.2,.7,.4,1) forwards;box-shadow:0 0 8px var(--c)}
.fxp.star{border-radius:0;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}

@keyframes fxb{0%{transform:translate(0,0) scale(.3) rotate(0)}45%{transform:translate(calc(var(--dx) * .7),var(--dy)) scale(1.2) rotate(180deg);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 90px)) scale(.4) rotate(360deg);opacity:0}}
.fxfly{position:absolute;left:0;top:0;width:34px;height:34px;display:grid;place-items:center;color:#FFC21E;filter:drop-shadow(0 0 8px rgba(255,210,60,.9)) drop-shadow(0 2px 0 #B97F00)}
.fxfly .ico,.fxfly svg{width:100%;height:100%}
.fxbump{animation:fxbump .45s}
@keyframes fxbump{30%{transform:scale(1.35)}60%{transform:scale(.92)}}
.fxban{position:absolute;left:0;right:0;top:24%;display:grid;place-items:center;animation:fxban 1.9s cubic-bezier(.2,.8,.3,1) forwards}
.fxribbon{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 34px;border-radius:20px;background:linear-gradient(180deg,#FFE46B,#FFA800);color:#5A2E00;box-shadow:0 8px 0 #B96F00,0 14px 40px rgba(0,0,0,.25),0 0 0 4px #fff;transform:rotate(-2deg)}
.fxribbon b{font:800 26px var(--font-d);letter-spacing:.02em;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.fxribbon small{font-size:14px;font-weight:700;opacity:.85}
@keyframes fxban{0%{transform:scale(.2) rotate(-12deg);opacity:0}18%{transform:scale(1.12) rotate(2deg);opacity:1}28%{transform:scale(1)}82%{transform:scale(1);opacity:1}100%{transform:scale(.7) translateY(-40px);opacity:0}}
.fxrays{position:absolute;width:var(--sz,300px);height:var(--sz,300px);margin:calc(var(--sz,300px) / -2) 0 0 calc(var(--sz,300px) / -2);border-radius:50%;background:repeating-conic-gradient(rgba(255,240,150,.85) 0 10deg,transparent 10deg 26deg);-webkit-mask-image:radial-gradient(closest-side,#000 20%,transparent);mask-image:radial-gradient(closest-side,#000 20%,transparent);animation:fxrays 1.6s ease-out forwards}
@keyframes fxrays{0%{transform:scale(.1) rotate(0);opacity:0}25%{opacity:1}100%{transform:scale(1.3) rotate(120deg);opacity:0}}
.fxflash{position:absolute;inset:0;animation:fxflash .5s ease-out forwards}
@keyframes fxflash{from{opacity:.85}to{opacity:0}}
.fxtext{position:absolute;transform:translate(-50%,-50%);font:800 24px var(--font-d);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 14px rgba(255,200,40,.9);white-space:nowrap;animation:gpop 1.4s ease-out forwards}
.fxtext.big{font-size:32px;color:#FFE046}
.fxtext.combo{font-size:30px;color:#FF7AB8;text-shadow:0 3px 0 #8A1F55,0 0 18px #fff}
.fxcanvas{position:absolute;inset:0;width:100%;height:100%}
@property --ir{syntax:"<length>";inherits:false;initial-value:0px}
.fxiris{position:absolute;inset:0;--ir:0px;background:radial-gradient(circle at 50% 60%,transparent var(--ir),#10203A calc(var(--ir) + 1px));animation:fxiris .75s cubic-bezier(.55,0,.35,1) forwards}
@keyframes fxiris{0%{--ir:0px;opacity:1}85%{opacity:1}100%{--ir:120vmax;opacity:0}}
.fxshake{animation:shake .35s 2}
.typing::after{content:"▍";color:var(--ga);animation:twinkle .6s steps(1) infinite}
.gport.talk svg{animation:talkb .26s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes talkb{to{transform:scale(1.04,.96) translateY(1px)}}
.gdlg .gcard{animation:cardin .32s cubic-bezier(.2,.9,.3,1.2)}

.gdlg .gopts{animation:fade .35s .15s both}
.gans{transition:transform .1s}
.gans:active{transform:scale(.98)}
.gans.ok{animation:okp .45s}
@keyframes okp{40%{transform:scale(1.05)}}
.toggles select.sel{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;color:var(--fg);font:600 13.5px var(--font-b);max-width:52%}

.dio{position:fixed;inset:0;overflow:hidden;display:block;background:linear-gradient(180deg,#46A8F5 0%,#9ED8FF 40%,#CFF0FF 100%)}

.dsky{position:absolute;left:0;right:0;top:0;height:40%;pointer-events:none}
.dsky .sun{position:absolute;right:12%;top:26%;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#FFFBE0,#FFE15A 55%,#FFC21E);box-shadow:0 0 40px 10px rgba(255,225,90,.6)}
.dsky .sun b,.csky .sun b{position:absolute;inset:-60px;border-radius:50%;background:repeating-conic-gradient(rgba(255,240,170,.4) 0 9deg,transparent 9deg 22deg);-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent);mask-image:radial-gradient(closest-side,#000 30%,transparent);animation:spin 30s linear infinite}

.dcl{top:16%;height:90px;width:300%;background-size:auto 100%;animation:drift 90s linear infinite;position:absolute;left:0}

.dmtn{position:absolute;left:0;right:0;bottom:-8px;height:120px;background-repeat:repeat-x;background-size:auto 100%;opacity:.85}
.d3{position:absolute;left:0;right:0;top:20%;bottom:0;perspective:1100px;perspective-origin:50% -20%}
.cm3{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.dboard{--tilt:52deg;position:absolute;left:50%;bottom:3%;width:min(112vw,560px);aspect-ratio:360/640;transform:translateX(-50%) rotateX(var(--tilt));transform-origin:50% 100%;transform-style:preserve-3d;border-radius:28px;box-shadow:0 40px 60px rgba(20,60,20,.3)}

.dground{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:28px}
.dbb{position:absolute;width:var(--w);margin-left:calc(var(--w) / -2);transform-origin:50% 100%;transform:rotateX(calc(-1 * var(--tilt)));display:flex;flex-direction:column-reverse;align-items:center;gap:2px;pointer-events:none;backface-visibility:hidden}
.dbb>svg,.dbb .dic svg{width:100%;height:auto;display:block;overflow:visible}
.dbb .dic{width:var(--w);display:block}
.vnode2,.cnode2{width:calc(var(--w) + 60px);margin-left:calc(var(--w) / -2 - 30px)}
.dbb .dic svg{max-height:calc(var(--w) * 1.25)}
.vnode2,.cnode2{pointer-events:auto;cursor:pointer}
.vnode2 b,.cnode2 b{order:-1;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.96);color:var(--gk);font:800 12.5px var(--font-b);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.cnode2 b{color:#5A3A1A}
.vnode2 small,.cnode2 small{font-size:10.5px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);white-space:nowrap}
.vst{position:absolute;right:22px;top:-4px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ga);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.vst .ico{width:16px;height:16px}
.vnode2.done .vst,.cnode2.done .vst{background:#2DBE77}

.vnode2.cur .dic,.cnode2.at .dic{animation:hop 1.6s ease-in-out infinite;transform-origin:50% 100%}

.dhero{z-index:2}

.cpulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.caravan2{z-index:3}

.caravan2 .chero svg{width:100%;height:auto}
.caravan2.left>svg,.caravan2.left .chero{transform:scaleX(-1)}
.caravan2.move>svg{animation:walk .45s ease-in-out infinite}
.cdust{position:absolute;width:26px;height:12px;margin-left:-13px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,240,210,.9),transparent);animation:dust .9s ease-out forwards;pointer-events:none}
.cbar{position:absolute;left:0;right:0;bottom:0;z-index:5}
/* shahar 3D */
.ccity .cscene{position:relative;flex:1;min-height:0;overflow:hidden}
.c3{position:absolute;inset:0;perspective-origin:50% 42%;overflow:hidden}
.csky{position:absolute;inset:-10% -20% 0 -20%}
.csky .sun{position:absolute;right:26%;top:18%;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#FFF8DA,#FFD45A 60%,#FFAF3D);box-shadow:0 0 40px 12px rgba(255,210,90,.55)}
.clay{position:absolute;inset:0;transform-origin:50% 42%;pointer-events:none}
.clay>svg{position:absolute;inset:0;width:100%;height:100%}
.clay.back{filter:saturate(.85)}
.walker{position:absolute;left:-12%;width:13%;max-width:60px;aspect-ratio:2/3;animation:walkacross var(--d) linear var(--dl) infinite}

.walker.w1,.walker.w3{animation-direction:reverse}

.birds{position:absolute;left:-10%;top:16%;animation:birds 22s linear infinite}

.birds i:nth-child(2){left:22px;top:10px;animation-delay:.15s} .birds i:nth-child(3){left:40px;top:2px;animation-delay:.3s}
@keyframes birds{to{transform:translateX(130vw) translateY(-20px)}}
@keyframes flapb{to{transform:scaleY(-.6)}}
.petal.gold{background:radial-gradient(circle,#FFF3B0 30%,rgba(255,220,120,.2) 70%);box-shadow:0 0 6px #FFD86B}
.spot.sch .sic{background:linear-gradient(180deg,#8FE3FF,#2E9BD6);color:#fff;box-shadow:0 4px 0 #1C6E9E,0 0 0 6px rgba(80,180,240,.3),0 0 22px rgba(120,210,255,.8)}
.spot .sic{background:linear-gradient(180deg,#FFE066,#FFB800);box-shadow:0 4px 0 #C98F00,0 0 0 6px rgba(255,197,49,.3),0 0 18px rgba(255,200,40,.75)}
.glowb{animation:actg 1.4s ease-in-out infinite}
.cchero{z-index:2}

/* Odobim v3: farzandlar, ota-ona, yangi o'yinlar */
.kidchip{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left}
.kidchip span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.kidchip b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .kidchip small{font-size:12px;color:var(--muted)}
.kav{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--o2) 18%,var(--surface2))}
.kav.big{width:64px;height:64px;font-size:38px}
.icb.parent{color:var(--accent)}
.tleft{color:var(--o1)} .odbar .tleft .ico{fill:none;stroke:currentColor}
.who{font:700 24px var(--font-d)}
.kidgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kidcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:0 5px 0 var(--line);text-align:center;transition:transform .1s}
.kidcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.kidcard b{font-size:16px} .kidcard small{color:var(--muted);font-size:12px}
.kidcard em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--o1)}
.kidcard.add .kav{background:var(--surface2);color:var(--muted);font-size:30px}
.timeup .mascot{width:110px;height:138px;animation:float 3s ease-in-out infinite}
.timeup h2{font:700 21px var(--font-d)}
.tustat{display:flex;gap:10px} .tustat span{display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.avs button{aspect-ratio:1;border-radius:16px;font-size:28px;background:var(--surface2);border:2px solid transparent}
.avs button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface2))}
.pills.left{justify-content:flex-start}
.btn.del{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.kidrow .row>div{flex:1}
.tbar{display:flex;flex-direction:column;gap:4px}
.tbar>div{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.toggles.plain{padding:0;gap:0;overflow:hidden}
.toggles.plain label{background:var(--surface)}
.toggles input:disabled{opacity:.4}
.rtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rtiles div{padding:12px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center}
.rtiles b{font:700 17px var(--font-d)} .rtiles small{font-size:11px;color:var(--muted);text-align:center}
.wchart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:130px;align-items:end}
.wchart div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wchart span{font-size:11px;font-weight:700;color:var(--muted);min-height:14px}
.wchart i{width:70%;max-width:26px;border-radius:6px 6px 3px 3px;background:color-mix(in srgb,var(--accent) 55%,var(--surface2))}
.wchart i.today{background:var(--accent)}
.wchart small{font-size:11px;color:var(--muted)}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.pindots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--accent);border-color:var(--accent)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pinpad button{height:56px;border-radius:16px;background:var(--surface2);font:700 22px var(--font-d)}
.pinpad button:active{background:var(--line)}
.kidtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.kidtabs button{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;white-space:nowrap}
.kidtabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bonus.big{font-size:16px}
/* dars: yangi turlar */
.bubble{position:relative;padding-right:48px}
.spk{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,var(--surface2));color:var(--accent)}
.combo{align-self:center;padding:6px 14px;border-radius:999px;background:color-mix(in srgb,var(--fire) 18%,var(--surface));color:var(--fire);font-weight:800;animation:pop .4s}
.listen{display:flex;flex-direction:column;align-items:center;gap:8px}
.lbtn{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--o1);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--o1) 60%,#000)}
.lbtn .ico{width:38px;height:38px}
.lbtn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--o1) 60%,#000)}
.lbtn.pulse{animation:pulse .6s}
.lsay{font:700 18px var(--font-b);color:var(--o1)}
.opts.pic{grid-template-columns:1fr 1fr}
.opts.pic .opt2{flex-direction:column;justify-content:center;gap:4px;padding:16px 8px;text-align:center}
.emo{font-size:52px;line-height:1.1}
.opts.pic small{font-size:13px;font-weight:600;color:var(--muted)}
.wline{min-height:62px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0;border-bottom:2px dashed var(--line)}
.wph{color:var(--muted);font-size:14px;padding:8px 0}
.wbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.wtok{padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:15px}
.wtok.gone{visibility:hidden}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid>div{display:flex;flex-direction:column;gap:10px}
.mt{min-height:58px;padding:10px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:14px;text-align:center;line-height:1.25;transition:background .15s,border-color .15s}
.mt.sel{border-color:var(--o1);background:color-mix(in srgb,var(--o1) 14%,var(--surface));color:var(--o1)}
.mt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok);opacity:.55;box-shadow:none}
.mt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--surface))}
/* maskot va konfetti */
.mascot.happy{animation:hop .55s ease-out}
.mascot.jump{animation:hop .6s ease-out 2}
.mascot.sad{animation:tilt .6s ease-in-out}
.mascot.talk .mouth{animation:talk .28s ease-in-out infinite alternate;transform-origin:40px 55px}
.mascot .eyes{animation:blink 4.5s infinite;transform-origin:40px 46px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.4s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@keyframes hop{30%{transform:translateY(-14px) scale(1.05)}60%{transform:translateY(0) scale(.97,1.03)}}
@keyframes tilt{25%{transform:rotate(-8deg)}75%{transform:rotate(6deg)}}
@keyframes talk{to{transform:scaleY(1.9)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}}

.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes ring{50%{transform:scale(1.08);opacity:.5}}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
@keyframes float{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
